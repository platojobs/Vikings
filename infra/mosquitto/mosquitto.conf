# Mosquitto 配置：设备用 TCP 1883，管理后台用 MQTT over WebSocket 9001
# 生产环境请关闭 allow_anonymous 并接入账号体系与 ACL

# ---------- 设备侧：标准 MQTT over TCP ----------
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# ---------- 管理后台侧：MQTT over WebSocket ----------
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# ---------- 通用参数 ----------
# 单客户端最大未确认消息数，避免慢速客户端拖垮 Broker
max_inflight_messages 20
max_queued_messages 1000
# 设备连接上限（演示环境放宽，生产按设备规模调整）
max_connections -1
max_keepalive 120

# 保留消息持久化：设备在线状态依赖 retained 报文
persistence true
persistence_location infra/mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
