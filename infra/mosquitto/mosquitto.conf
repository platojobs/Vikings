# Mosquitto 配置：设备用 TCP 1883，管理后台用 MQTT over WebSocket 9001
#
# 两个监听都禁止匿名：
#   - 1883：设备（用户名=deviceId）与网关服务账号，ACL 见 acl.device
#   - 9001：Web / 移动端只读主体，ACL 见 acl.client（无任何 write 规则）
#
# 口令与 ACL 按监听独立生效（per_listener_settings true）：
#   - 口令文件：passwd（由 scripts/mqtt_credentials.py 生成，不入库）
#   - 设备/网关 ACL：acl.device（入库，无口令）
#   - 客户端 ACL：acl.client（入库，无口令）
#   - 重载方式：对 Broker 发送 SIGHUP（本地 kill -HUP $(cat .run/mosquitto.pid)；
#     Docker：docker compose -f infra/docker-compose.yml kill -s HUP mosquitto）
#     Broker 收到 SIGHUP 后重新读取 password_file / acl_file，无需重启容器。
#
# 路径均为相对路径，按 Broker 进程工作目录解析：
#   - 本地 start_all.sh：工作目录 infra/mosquitto/
#   - Docker：目录挂载到 /mosquitto/config，并设置 working_dir
#   - E2E：临时工作目录中复制本配置与生成的口令文件

per_listener_settings true

# ---------- 设备侧：标准 MQTT over TCP ----------
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file passwd
acl_file acl.device

# ---------- 管理后台侧：MQTT over WebSocket ----------
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file passwd
acl_file acl.client

# ---------- 通用参数 ----------
# 单客户端最大未确认消息数，避免慢速客户端拖垮 Broker
max_inflight_messages 20
max_queued_messages 1000
# 设备连接上限（演示环境放宽，生产按设备规模调整）
max_connections -1
max_keepalive 120

# 保留消息持久化：设备在线状态依赖 retained 报文
persistence true
persistence_location data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
