# Web 静态托管（容器内 8080，非 root）。
# 只负责静态资源与 SPA 回退；API / MQTT 由边缘反代（infra/prod/nginx）转发。
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 带指纹的构建产物可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发布后立即拿到新资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
