# 边缘反代：对外只暴露 80/443（443 承载 Web、REST 与 MQTT over WebSocket）。
# 内部 topology：
#   browser ──https──► proxy ──/api──► gateway:8000 ──► postgres
#                         │        └─/mqtt─► mosquitto:9001
#                         └─/──────────► web:8080（静态资源）

upstream iot_gateway {
    server gateway:8000;
    keepalive 32;
}

upstream iot_web {
    server web:8080;
    keepalive 32;
}

upstream iot_mqtt_ws {
    server mosquitto:9001;
}

# 访问日志带 requestId：优先取上游传进来的 X-Request-Id，否则取网关生成的响应头。
# 排查时先用网关错误响应里的 requestId 搜网关 JSON 日志，再用 grid 对齐反代日志。
log_format iot '$remote_addr - $remote_user [$time_local] "$request" '
               '$status $body_bytes_sent rt=$request_time '
               'up=$upstream_addr urt=$upstream_response_time '
               'rid=$http_x_request_id grid=$upstream_http_x_request_id';

# HTTP 仅用于证书签发挑战与跳转 HTTPS
server {
    listen 80;
    server_name _;

    # 反代自身健康检查走 HTTP，避免自签证书导致容器健康检查失败
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME HTTP-01 挑战目录；改用 Let's Encrypt 时把证书放行到该目录
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 覆盖 nginx.conf 的默认 access_log（server 级定义会替换继承的 http 级配置），
    # 只保留带 requestId 与上游耗时的格式，避免一行请求打印两遍。
    access_log /var/log/nginx/access.log iot;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 10m;

    # 基础安全响应头（HTTPS 验证通过后 HSTS 才会被浏览器接受）
    # 分工：所有安全头都在 nginx 这一层加，应用（FastAPI/Vue 静态站）不重复添加，
    # 避免同一响应出现两条 CSP/HSTS 时浏览器按「交集」执行导致误伤。
    # includeSubDomains 取舍：本部署的证书覆盖主域 + 所有子域，开启后避免子域
    # 成为降级入口；若未来有子域只能跑 HTTP（如旧设备管理页），必须先去
    # chrome://net-internals 清 HSTS 或换独立域名，否则该子域会被直接拒绝。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP 说明（v1.24.0 实测结论见 docs/deployment.md）：
    # - script-src 沿用 default-src 'self'：Vite 产物无内联脚本，Element Plus 不需要 eval；
    # - style-src 必须保留 'unsafe-inline'：Element Plus 大量使用内联 style 属性；
    # - worker-src 必须放行 blob:：ECharts 用 blob: Worker 做渐进渲染，实测不加会报
    #   "Creating a worker from 'blob:...' violates default-src"（仅在图表页触发）；
    # - connect-src 'self'：REST 与 wss://<host>/mqtt 都是同源，覆盖 MQTT WebSocket；
    #   若把 VITE_API_BASE 改成跨域地址，必须同步把该源加入 connect-src，否则前端会
    #   被 CSP 拦截（这是「加了头但不验证效果」最常见的翻车点）。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 登录入口：单独 location 便于开启反代层限流（默认关闭，网关自身已有 IP+账号锁定）
    location = /api/auth/login {
        # 可选：取消下一行注释即启用 conf.d/01-zones.conf 定义的 login_zone
        # include /etc/nginx/snippets/login-limit.conf;
        proxy_pass http://iot_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # 上游传了 X-Request-Id 就沿用它，否则网关生成并回写响应头
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 30s;
    }

    # REST API（含 /api/auth/mqtt-credentials 的设备/客户端凭证下发）
    location /api/ {
        proxy_pass http://iot_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 显式透传 Bearer Token，避免后续调整 proxy_set_header 时被误删
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Prometheus 抓取端点（v1.20.0）。只放行内网来源；公网一律 403。
    # 抓取方式见 docs/observability.md；网关自身 8000 端口不发布到宿主机。
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://iot_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        access_log off;
    }

    # MQTT over WebSocket：Mosquitto 的 WebSocket 监听固定使用 /mqtt 路径。
    # 认证仍由 Broker 的 password_file + ACL 强制，反代不参与鉴权。
    location = /mqtt {
        proxy_pass http://iot_mqtt_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 其余路径为管理后台静态资源与 SPA 路由
    location / {
        proxy_pass http://iot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
    }
}
