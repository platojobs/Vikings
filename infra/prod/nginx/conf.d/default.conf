# 边缘反代：对外只暴露 80/443（443 承载 Web、REST 与 MQTT over WebSocket）。
# 内部 topology：
#   browser ──https──► proxy ──/api──► gateway:8000 ──► postgres
#                         │        └─/mqtt─► mosquitto:9001
#                         └─/──────────► web:8080（静态资源）

upstream iot_gateway {
    server gateway:8000;
    keepalive 32;
}

upstream iot_web {
    server web:8080;
    keepalive 32;
}

upstream iot_mqtt_ws {
    server mosquitto:9001;
}

# HTTP 仅用于证书签发挑战与跳转 HTTPS
server {
    listen 80;
    server_name _;

    # 反代自身健康检查走 HTTP，避免自签证书导致容器健康检查失败
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME HTTP-01 挑战目录；改用 Let's Encrypt 时把证书放行到该目录
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 10m;

    # 基础安全响应头（HTTPS 验证通过后 HSTS 才会被浏览器接受）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 登录入口：单独 location 便于开启反代层限流（默认关闭，网关自身已有 IP+账号锁定）
    location = /api/auth/login {
        # 可选：取消下一行注释即启用 conf.d/01-zones.conf 定义的 login_zone
        # include /etc/nginx/snippets/login-limit.conf;
        proxy_pass http://iot_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    # REST API（含 /api/auth/mqtt-credentials 的设备/客户端凭证下发）
    location /api/ {
        proxy_pass http://iot_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 显式透传 Bearer Token，避免后续调整 proxy_set_header 时被误删
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # MQTT over WebSocket：Mosquitto 的 WebSocket 监听固定使用 /mqtt 路径。
    # 认证仍由 Broker 的 password_file + ACL 强制，反代不参与鉴权。
    location = /mqtt {
        proxy_pass http://iot_mqtt_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 其余路径为管理后台静态资源与 SPA 路由
    location / {
        proxy_pass http://iot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
