# 生产 Broker 配置（容器内绝对路径版本）。
# 与开发用 infra/mosquitto/mosquitto.conf 的鉴权策略一致：
#   - 1883 设备 TCP、9001 WebSocket，均 allow_anonymous false；
#   - 两个监听加载同一 password_file，各自加载独立 ACL；
#   - 持久化落在命名卷 /mosquitto/data，容器重建不丢 retained/队列数据。
#
# 生产 compose 只挂载 acl.* 与 passwd（passwd 由 infra/prod/secrets 提供），
# 本文件只读挂载到 /mosquitto/config/mosquitto.conf。

per_listener_settings true

# ---------- 设备侧：标准 MQTT over TCP ----------
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.device

# ---------- 管理后台侧：MQTT over WebSocket ----------
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.client

# ---------- 通用参数 ----------
max_inflight_messages 20
max_queued_messages 1000
max_connections -1
max_keepalive 120

# 保留消息持久化：设备在线状态依赖 retained 报文
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
