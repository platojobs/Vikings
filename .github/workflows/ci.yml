name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway:
    name: Python 网关（lint + 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 语法校验（编译检查）
        run: python -m compileall app
      - name: 单元测试
        run: pytest -q

  web:
    name: Vue 后台（单元测试 + 类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 单元测试（路由守卫）
        run: npm run test
      - name: 类型检查 + 构建
        run: npm run build

  device_app:
    name: Flutter 设备端（分析 + 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 与 device_app/pubspec.yaml 的 sdk: ^3.13.7 对齐：
          # 3.24.0 自带 Dart 3.5，会在 flutter pub get 阶段直接失败
          flutter-version: "3.47.9"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  e2e:
    name: 真实 Broker 端到端验收
    runs-on: ubuntu-latest
    # 安装依赖 + 真实 Broker/网关/模拟器全链路，正常 2~3 分钟；超时兜底防卡死
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Mosquitto（1883 TCP + 9001 WebSocket）
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          # 发行版包自带 mosquitto.service，会占用 1883；验收必须由脚本托管 Broker
          sudo systemctl stop mosquitto || true
          sudo systemctl disable mosquitto || true
          sudo pkill -x mosquitto || true
          mosquitto -h 2>&1 | head -3 || true
      - name: 安装网关与 E2E 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt -r scripts/e2e/requirements.txt
      - name: 检查端口占用
        run: |
          python - <<'PY'
          import socket, sys

          busy = []
          for port in (1883, 9001, 8000):
              with socket.socket() as sock:
                  sock.settimeout(0.3)
                  if sock.connect_ex(("127.0.0.1", port)) == 0:
                      busy.append(port)
          if busy:
              print(f"::error::端口被占用：{busy}，可能仍有残留服务")
              sys.exit(1)
          print("端口 1883/9001/8000 空闲")
          PY
      - name: 运行真实 Broker 端到端验收
        run: python scripts/e2e/e2e_acceptance.py
      - name: 失败时输出日志
        if: failure()
        run: |
          for log in .run/e2e/*.log; do
            echo "===== $log"
            tail -80 "$log"
          done
      - name: 兜底清理
        if: always()
        run: |
          pkill -f "mosquitto -c" || true
          pkill -f "uvicorn app.main:app" || true
          pkill -f "simulate_device.py" || true
