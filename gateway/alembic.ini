# Alembic 配置（v1.19.0）。
#
# 用法（在 gateway/ 目录下，或容器内 /app）：
#   alembic upgrade head           # 空库建表 / 已有库补齐到最新
#   alembic current                # 查看当前版本
#   alembic stamp 0001_baseline    # 已有库显式标记 baseline（不执行建表）
#   alembic downgrade -1           # 回退一个迁移
#
# 数据库地址不写在这里：env.py 从 app.config（DATABASE_URL 环境变量）读取，
# 避免仓库里出现两套连接配置。

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# 由 env.py 注入，这里留空
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
